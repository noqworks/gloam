<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="14" fill="#1d1d1d">
  <title>Gloam wiring</title>
  <rect width="960" height="520" fill="#ffffff"/>
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- +12 V -->
    <path d="M150 110 H300 M220 110 V60 H700 V150 M700 60 H900 M760 60 V150 M820 60 V150" stroke="#1d1d1d"/>
    <path d="M520 300 V320 H560" stroke="#1d1d1d"/>
    <path d="M520 60 V300" stroke="#1d1d1d"/>
    <!-- GND -->
    <path d="M150 140 H300 M200 140 V470 H560 V420" stroke="#8a8a8a" stroke-dasharray="6 6"/>
    <path d="M420 220 V470" stroke="#8a8a8a" stroke-dasharray="6 6"/>
    <!-- 5 V -->
    <path d="M400 110 H440 V160" stroke="#1d1d1d"/>
    <!-- D1 / D2 -->
    <path d="M480 250 H540 V350 H560 M540 350 V370 H560" stroke="#d97706"/>
    <path d="M480 270 H530 V390 H560 M530 390 V410 H560" stroke="#6b7280"/>
    <!-- outputs -->
    <path d="M680 355 H700 V365 H680 M700 360 H720 V215 H840 V200 M720 215 V200" stroke="#d97706"/>
    <path d="M680 395 H700 V405 H680 M700 400 H920 V235 H740 V200 M860 235 V200" stroke="#6b7280"/>
  </g>

  <!-- power supply -->
  <rect x="40" y="90" width="110" height="70" rx="14" fill="#f4f4f4"/>
  <text x="56" y="120" font-weight="600">12 V PSU</text><text x="56" y="142" fill="#6b6b6b" font-size="12">≥ LED load</text>
  <text x="156" y="104" font-size="12">+12 V</text><text x="156" y="156" font-size="12" fill="#6b6b6b">GND</text>

  <!-- buck -->
  <rect x="300" y="90" width="100" height="70" rx="14" fill="#f4f4f4"/>
  <text x="314" y="120" font-weight="600">12→5 V</text><text x="314" y="142" fill="#6b6b6b" font-size="12">step-down</text>

  <!-- D1 mini -->
  <rect x="380" y="160" width="100" height="140" rx="14" fill="#f4f4f4"/>
  <text x="394" y="186" font-weight="600">D1 mini</text><text x="394" y="206" fill="#6b6b6b" font-size="12">ESP8266</text>
  <text x="446" y="174" font-size="12" fill="#6b6b6b">5V</text>
  <text x="426" y="254" font-size="12">D1</text><text x="426" y="274" font-size="12">D2</text>
  <text x="426" y="294" font-size="12" fill="#6b6b6b">GND</text>

  <!-- ULN2003A -->
  <rect x="560" y="300" width="120" height="130" rx="14" fill="#f4f4f4"/>
  <text x="574" y="290" font-weight="600">ULN2003A</text>
  <text x="566" y="324" font-size="11">COM 9</text>
  <text x="566" y="354" font-size="11">IN1</text><text x="566" y="374" font-size="11">IN2</text>
  <text x="566" y="394" font-size="11">IN3</text><text x="566" y="414" font-size="11">IN4</text>
  <text x="634" y="359" font-size="11">16·15</text><text x="634" y="399" font-size="11">14·13</text>
  <text x="566" y="444" font-size="11" fill="#6b6b6b">GND 8</text>

  <!-- fixtures -->
  <g>
    <rect x="660" y="150" width="120" height="50" rx="25" fill="#ffffff" stroke="#e2e2e2" stroke-width="2"/>
    <rect x="780" y="150" width="120" height="50" rx="25" fill="#ffffff" stroke="#e2e2e2" stroke-width="2"/>
    <text x="684" y="180" font-size="12">fixture 1</text><text x="804" y="180" font-size="12">fixture 2…16</text>
  </g>
  <text x="660" y="40" font-size="12">+12 V to every fixture (common anode)</text>

  <!-- legend -->
  <g font-size="12">
    <line x1="40" y1="230" x2="70" y2="230" stroke="#1d1d1d" stroke-width="2.5"/><text x="78" y="234">+12 V / +5 V</text>
    <line x1="40" y1="256" x2="70" y2="256" stroke="#8a8a8a" stroke-width="2.5" stroke-dasharray="6 6"/><text x="78" y="260">GND</text>
    <line x1="40" y1="282" x2="70" y2="282" stroke="#d97706" stroke-width="2.5"/><text x="78" y="286">amber −</text>
    <line x1="40" y1="308" x2="70" y2="308" stroke="#6b7280" stroke-width="2.5"/><text x="78" y="312">warm white −</text>
  </g>
</svg>
