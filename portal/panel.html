<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f5f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NOQopen" id="app-title">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>NOQopen</title>
<style>/*CSS*/</style>
</head>
<body>
<header class="np-shell">
  <span role="img" aria-label="NOQopen"><!--LOGO--></span>
  <nav class="np-lang" aria-label="Language">
    <button type="button" class="np-link" data-lang="tr">TR</button>
    <button type="button" class="np-link" data-lang="en">EN</button>
  </nav>
</header>
<main class="np-deck">
  <section class="np-card" aria-labelledby="h-device">
    <div class="np-stack">
      <p class="np-kicker" data-t="kicker"></p>
      <h1 class="np-title" id="h-device">NOQopen</h1>
      <p class="np-text" data-t="lede"></p>
    </div>
    <div class="np-chips">
      <span class="np-chip" id="chip-host"></span>
      <span class="np-chip" id="chip-ha" hidden></span>
    </div>
    <p class="np-small" id="status" role="status" aria-live="polite"></p>
  </section>
  <section class="np-card" id="home" hidden aria-labelledby="h-home">
    <div class="np-stack">
      <p class="np-kicker" data-t="homeKicker"></p>
      <h2 class="np-h" id="h-home" data-t="homeTitle"></h2>
    </div>
    <ol class="np-steps" id="home-steps"></ol>
    <div><button type="button" class="np-link" id="home-done" data-t="homeDone"></button></div>
  </section>
  <div class="np-col" id="lights"></div>
  <div class="np-col" id="groups"></div>
  <footer class="np-foot">
    <span class="np-small" data-t="foot"></span>
    <span class="np-small" id="version"></span>
  </footer>
</main>
<script>/*JS*/</script>
</body>
</html>
